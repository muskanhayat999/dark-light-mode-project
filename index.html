
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light & Dark Mode Toggle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <nav>
            <h2>My Website</h2>

            <button id="theme-toggle" class="toggle-btn">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">Dark Mode</span>
            </button>
        </nav>

        <section class="content">

            <h1>Welcome to My Website!</h1>

            <p>
                Experience a beautiful website with light and dark themes.
                Click the toggle button to switch between both modes.
            </p>

            <button class="explore-btn">Explore More</button>

        </section>

        <footer>
            <p>© 2026 My Website | Light & Dark Mode Project</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
